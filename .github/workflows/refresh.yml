name: Refresh Revolut X EEA universe

on:
  schedule:
    - cron: '17 03 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-eea-universe
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate failure handling
        run: python -m unittest discover -s tests -v
      - name: Fetch EEA pairs
        run: python fetch_pairs.py --output pairs.json
      - name: Commit validated snapshot
        run: |
          git add pairs.json
          if git diff --cached --quiet; then
            echo 'No change to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Revolut X EEA universe'
          git push
